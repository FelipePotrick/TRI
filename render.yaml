services:
  - type: web
    name: tri-backend
    runtime: go
    plan: free
    rootDir: tri-backend
    buildCommand: go build -o app .
    startCommand: ./app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: tri_db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "72"
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: tri-frontend
    runtime: static
    plan: free
    rootDir: tri-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
